# CertDeck lives in certdeck/ so this repo can host other projects; every
# job that touches the workspace runs from there.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight run finish rather
# than cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: certdeck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: certdeck/.nvmrc
          cache: npm
          cache-dependency-path: certdeck/package-lock.json
      - run: npm ci
      - run: npm run validate
      # vite build strips types with esbuild instead of checking them, and
      # the unit tests never see a type error either, so tsc is the only
      # thing standing between a type error and main.
      - run: npm run typecheck
      - run: npm run test

  # One matrix entry per app. Adding a certification means adding its
  # folder name here — nothing else in this workflow changes (see
  # AGENTS.md, "Adding a certification").
  build-apps:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: certdeck
    strategy:
      matrix:
        app:
          - network-plus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: certdeck/.nvmrc
          cache: npm
          cache-dependency-path: certdeck/package-lock.json
      - run: npm ci
      - run: npm run build -w apps/${{ matrix.app }}
      - uses: actions/upload-artifact@v7
        with:
          name: app-dist-${{ matrix.app }}
          path: certdeck/apps/${{ matrix.app }}/dist

  build-landing:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: certdeck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: certdeck/.nvmrc
          cache: npm
          cache-dependency-path: certdeck/package-lock.json
      - run: npm ci
      - run: npm run build -w landing
      - uses: actions/upload-artifact@v7
        with:
          name: landing-dist
          path: certdeck/landing/dist

  # Publication is a deliberate, one-off act at the end of development, not
  # something every push does — and GitHub Pages is not enabled on the repo
  # yet, so an automatic deploy would only fail with a 404 and train us to
  # ignore a red CI. Pushes therefore run the checks and the builds only;
  # deploying is an explicit "Run workflow" from the Actions tab. Drop this
  # `if` once Pages is enabled and continuous publishing is wanted.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [build-apps, build-landing]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Assembles the combined site purely from artifact names, so this
      # step never needs editing when an app is added to the matrix above:
      # the landing page goes to the site root, and each app-dist-<name>
      # artifact goes to dist/<name>/, matching that app's Vite `base`.
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -r artifacts/landing-dist/. dist/
          for dir in artifacts/app-dist-*/; do
            name="$(basename "$dir")"
            app="${name#app-dist-}"
            mkdir -p "dist/$app"
            cp -r "$dir." "dist/$app/"
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
